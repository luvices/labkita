<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Arsitektur Sistem LabKita Linux 0.6</title>
  <desc id="arch-desc">Tiga tahap arsitektur LabKita Linux 0.6: pertama Boot dan Autoinstall nocloud sekitar 4 menit, kedua isolasi dual akun admin labkita dan mahasiswa praktikan 0700, dan ketiga workspace luring di Praktikum, tmpfs RAM, serta panduan 7 modul ramah sandbox Firefox Snap.</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#arch-bg)" stroke="#23324D" stroke-width="1.5"/>

  <text x="44" y="54"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="18" font-weight="600" letter-spacing="1.2" fill="#38BDF8">ARSITEKTUR OPERASIONAL 0.6</text>
  <text x="44" y="90"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="28" font-weight="700" fill="#F8FAFC">Alur Boot, Pemisahan Akun, dan Lingkungan Praktikum</text>

  <g id="stage-1" transform="translate(44, 120)">
    <rect width="346" height="174" rx="16" fill="#152038" stroke="#2A3C5E" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" fill="#38BDF8">01 · GRUB &amp; NOCLOUD</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Autoinstall 0-Langkah</text>
    <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18.5" fill="#CBD5E1">Install otomatis ke disk ~4 menit</text>
    <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94A3B8">Logo Keystone LK di Plymouth &amp; GDM</text>
  </g>

  <path d="M 398 207 H 420 M 412 199 L 420 207 L 412 215" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-2" transform="translate(427, 120)">
    <rect width="346" height="174" rx="16" fill="#152038" stroke="#2A3C5E" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" fill="#38BDF8">02 · ISOLASI AKUN</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Dual Role Siap Pakai</text>
    <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18.5" fill="#CBD5E1">labkita: admin (sudo) &amp; asisten</text>
    <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94A3B8">praktikan: non-sudo, mode 0700</text>
  </g>

  <path d="M 781 207 H 803 M 795 199 L 803 207 L 795 215" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-3" transform="translate(810, 120)">
    <rect width="346" height="174" rx="16" fill="#152038" stroke="#1E4B45" stroke-width="1.5"/>
    <text x="24" y="38" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600" fill="#34D399">03 · RUANG PRAKTIKUM</text>
    <text x="24" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Toolchain &amp; Sandbox</text>
    <text x="24" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18.5" fill="#CBD5E1">~/Praktikum: GCC, GDB, Python</text>
    <text x="24" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94A3B8">/run/labkita tmpfs · AppArmor OK</text>
  </g>
</svg>
