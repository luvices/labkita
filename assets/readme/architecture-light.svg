<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="arch-title-light arch-desc-light">
  <title id="arch-title-light">Pemisahan hak akses dan ruang kerja LabKita Linux 0.6</title>
  <desc id="arch-desc-light">Diagram arsitektur LabKita Linux 0.6: alur boot dan autoinstall nocloud terhubung ke dua tingkat hak akses, yaitu akun admin labkita dengan sudo dan akun praktikan terisolasi mode 0700 dengan zona Praktikum, Panduan AppArmor OK, serta tmpfs noexec.</desc>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1"/>

  <text x="48" y="54"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="26" font-weight="500" letter-spacing="-0.3" fill="#171717">Pemisahan hak akses dan ruang kerja</text>
  <text x="48" y="86"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="18.5" font-weight="400" fill="#525252">Alur pemasangan otomatis, batas isolasi akun 0700, dan zona penyimpanan luring di rilis 0.6</text>

  <g id="boot-rail-light">
    <rect x="48" y="116" width="272" height="244" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <text x="72" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="500" fill="#171717">Boot &amp; pemasangan</text>

    <line x1="80" y1="184" x2="80" y2="274" stroke="#D4D4D8" stroke-width="1.5"/>
    <circle cx="80" cy="184" r="4" fill="#171717"/>
    <circle cx="80" cy="229" r="4" fill="#171717"/>
    <circle cx="80" cy="274" r="4" fill="#1D4ED8"/>

    <text x="98" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#171717">GRUB · ISO 0.6</text>
    <text x="98" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#171717">Autoinstall nocloud</text>
    <text x="98" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#171717">Plymouth &amp; GDM</text>

    <line x1="72" y1="308" x2="296" y2="308" stroke="#E4E4E7" stroke-width="1"/>
    <text x="72" y="338" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#737373">~4 menit ke disk</text>
  </g>

  <g id="connectors-light" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 320 238 H 340"/>
    <path d="M 340 154 V 298"/>
    <path d="M 340 154 H 360"/>
    <path d="M 353 148 L 360 154 L 353 160"/>
    <path d="M 340 298 H 360"/>
    <path d="M 353 292 L 360 298 L 353 304"/>
  </g>

  <g id="admin-band-light">
    <rect x="364" y="116" width="788" height="76" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <text x="388" y="160" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="500" fill="#171717">labkita</text>
    <text x="484" y="160" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#737373">admin · sudo</text>
    <text x="1128" y="160" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#525252">Kelola sistem, labkita-postinstall, &amp; diagnostik</text>
  </g>

  <g id="boundary-rule-light">
    <line x1="364" y1="214" x2="504" y2="214" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="758" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#1D4ED8">Batas isolasi non-sudo · /home/praktikan mode 0700</text>
    <line x1="1012" y1="214" x2="1152" y2="214" stroke="#1D4ED8" stroke-width="1.2" stroke-dasharray="6 5"/>
  </g>

  <g id="praktikan-band-light">
    <rect x="364" y="236" width="788" height="124" rx="12" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <rect x="364" y="248" width="3" height="100" rx="1.5" fill="#1D4ED8"/>

    <text x="388" y="270" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="500" fill="#171717">praktikan</text>
    <text x="512" y="270" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="400" fill="#737373">grup labkita-praktikum</text>

    <line x1="388" y1="288" x2="1128" y2="288" stroke="#E4E4E7" stroke-width="1"/>

    <text x="388" y="316" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="500" fill="#171717">~/Praktikum</text>
    <text x="388" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#525252">GCC, GDB, Python (rwx)</text>

    <line x1="652" y1="300" x2="652" y2="348" stroke="#E4E4E7" stroke-width="1"/>

    <text x="676" y="316" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="500" fill="#171717">~/Dokumen/Panduan</text>
    <text x="676" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#525252">7 modul · AppArmor OK</text>

    <line x1="916" y1="300" x2="916" y2="348" stroke="#E4E4E7" stroke-width="1"/>

    <text x="940" y="316" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="500" fill="#171717">/run/labkita</text>
    <text x="940" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#525252">tmpfs 1777 · noexec</text>
  </g>
</svg>
