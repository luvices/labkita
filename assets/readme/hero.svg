<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">LabKita Linux 0.6 - Distribusi Ubuntu 24.04.5 LTS untuk Praktikum Luring</title>
  <desc id="hero-desc">Kartu identitas LabKita Linux 0.6 menampilkan logo Keystone LK, autoinstall 0-langkah, dual akun admin dan praktikan 0700, serta cuplikan terminal verifikasi labkita-check yang lulus semua 25 pemeriksaan.</desc>

  <defs>
    <linearGradient id="bg-slate" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <pattern id="arch-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <clipPath id="canvas-clip">
      <rect width="1200" height="420" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="420" fill="url(#bg-slate)"/>
    <rect width="1200" height="420" fill="url(#arch-grid)" opacity="0.55"/>
    <path d="M 480 -40 L 720 460" stroke="#2563EB" stroke-width="96" opacity="0.09"/>
    <line x1="470" y1="-40" x2="710" y2="460" stroke="#38BDF8" stroke-width="1.5" opacity="0.22"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="22" fill="none" stroke="#23324D" stroke-width="1.5"/>

  <g id="hero-identity" transform="translate(56, 52)">
    <text x="0" y="20"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
          font-size="18" font-weight="600" letter-spacing="1.4" fill="#38BDF8">UBUNTU 24.04.5 LTS  ·  RILIS 0.6</text>

    <g id="keystone-mark" transform="translate(0, 44) scale(0.3)">
      <path fill="#F8FAFC" d="M 32 32 H 72 V 184 H 184 L 224 224 H 32 Z"/>
      <path fill="#2563EB" d="M 96 32 H 132 V 72 L 172 32 H 224 L 160 96 L 224 160 H 172 L 132 120 V 160 H 96 Z"/>
    </g>

    <text x="92" y="102"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
          font-size="54" font-weight="700" fill="#F8FAFC">LabKita Linux</text>

    <text x="0" y="158"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
          font-size="21" font-weight="400" fill="#CBD5E1">Siap pakai untuk lab C/C++, Python, &amp; Sistem Operasi.</text>
    <text x="0" y="190"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
          font-size="21" font-weight="400" fill="#94A3B8">Autoinstall cepat, dual akun, buku kerja 7 modul luring.</text>

    <g id="proof-metrics" transform="translate(0, 232)">
      <rect x="0" y="0" width="174" height="82" rx="12" fill="#152038" stroke="#253554" stroke-width="1.2"/>
      <text x="18" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">0-Langkah</text>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94A3B8">Autoinstall</text>

      <rect x="190" y="0" width="174" height="82" rx="12" fill="#152038" stroke="#253554" stroke-width="1.2"/>
      <text x="208" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">2 Akun</text>
      <text x="208" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94A3B8">Admin &amp; 0700</text>

      <rect x="380" y="0" width="176" height="82" rx="12" fill="#152038" stroke="#1E4B45" stroke-width="1.2"/>
      <text x="398" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#34D399">25 / 25</text>
      <text x="398" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#94A3B8">labkita-check</text>
    </g>
  </g>

  <g id="terminal-proof" transform="translate(646, 52)">
    <rect x="0" y="0" width="498" height="316" rx="14" fill="#0B1324" stroke="#2A3C5E" stroke-width="1.5"/>
    <path d="M 0 14 A 14 14 0 0 1 14 0 H 484 A 14 14 0 0 1 498 14 V 44 H 0 Z" fill="#16223A"/>
    <line x1="0" y1="44" x2="498" y2="44" stroke="#253554" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#475569"/>
    <circle cx="44" cy="22" r="6" fill="#475569"/>
    <circle cx="64" cy="22" r="6" fill="#475569"/>
    <text x="476" y="28" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"
          font-size="18" fill="#94A3B8">praktikan@labkita: ~</text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="18.5">
      <text x="22" y="82" fill="#F1F5F9"><tspan fill="#38BDF8">$</tspan> stat -c %a ~ &amp;&amp; id -Gn</text>
      <text x="22" y="112" fill="#94A3B8">700 · praktikan labkita-praktikum</text>

      <text x="22" y="152" fill="#F1F5F9"><tspan fill="#38BDF8">$</tspan> gcc hello.c -o hello &amp;&amp; ./hello</text>
      <text x="22" y="182" fill="#34D399">Halo dari LabKita Linux!</text>

      <text x="22" y="222" fill="#F1F5F9"><tspan fill="#38BDF8">$</tspan> labkita-check</text>
      <text x="22" y="252" fill="#34D399">[LULUS] WhiteSur, Plymouth, GDM</text>
      <text x="22" y="286" font-weight="700" fill="#34D399">SEMUA PEMERIKSAAN LULUS (25/25)</text>
    </g>
  </g>
</svg>
